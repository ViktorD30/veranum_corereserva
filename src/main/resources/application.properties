# ============================================
# VERANUM - MICROSERVICIO DE RESERVAS
# ============================================

spring.application.name=veranum_corereserva

# Puerto del microservicio
server.port=8082


# ============================================
# BASE DE DATOS MYSQL
# ============================================

spring.datasource.url=jdbc:mysql://localhost:3306/veranum_reserva?useSSL=false&serverTimezone=America/Santiago&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================
# JPA / HIBERNATE
# ============================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ===========================================
# COMUNICACION ENTRE MICROSERVICIOS
# ===========================================

# Microservicio de usuarios - puerto 8081
usuario.service.base-url=${USUARIO_SERVICE_BASE_URL:http://localhost:8081}

# Microservicio de habitaciones - puerto 8083
habitacion.service.base-url=${HABITACION_SERVICE_BASE_URL:http://localhost:8083}